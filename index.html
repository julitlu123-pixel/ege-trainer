<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ЕГЭ Тренажёр</title>

  <!-- KaTeX для формул -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- MathLive: визуальный конструктор формул -->
  <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>

  <!-- Официальная библиотека Supabase JS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card-bg: #1e293b;
      --card-hover: #243248;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --badge-physics: #38bdf8;
      --badge-math: #ec4899;
      --badge-rus: #f59e0b;
      --status-cloud: #10b981;
      --btn-secondary: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 24px 16px;
      display: flex;
      justify-content: center;
    }

    .container { width: 100%; max-width: 820px; }
    
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .brand-title { display: flex; align-items: center; gap: 8px; }
    h1 { font-size: 1.5rem; font-weight: 700; }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--status-cloud);
      display: inline-block;
      box-shadow: 0 0 8px var(--status-cloud);
    }
    
    .tabs { display: flex; gap: 8px; }
    button {
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.2s;
      font-family: inherit;
    }
    button:hover { border-color: var(--accent); }
    button.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    button.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; width: 100%; padding: 12px; font-weight: 600; font-size: 1rem; }
    button.btn-primary:hover { background: var(--accent-hover); }
    button.btn-secondary { background: var(--btn-secondary); }
    button.btn-secondary:hover { background: #475569; }

    .view { display: none; }
    .view.active { display: block; }

    /* Панель фильтров */
    .filter-panel {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .filter-title { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 8px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
    .subject-pills { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .pill {
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      cursor: pointer;
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.2s;
    }
    .pill:hover { border-color: var(--accent); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .topics-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-height: 130px;
      overflow-y: auto;
      padding: 4px 2px;
    }
    .topic-chip {
      display: flex;
      align-items: center;
      gap: 6px;
      background: rgba(0,0,0,0.25);
      border: 1px solid var(--border);
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      user-select: none;
      transition: border-color 0.2s;
    }
    .topic-chip:hover { border-color: var(--accent); }

    /* Карточки тренировки */
    .flashcard {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .meta-tags { display: flex; gap: 8px; align-items: center; margin-bottom: 14px; flex-wrap: wrap; }
    .badge {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .badge-Физика { background: rgba(56, 189, 248, 0.15); color: var(--badge-physics); border: 1px solid var(--badge-physics); }
    .badge-Математика { background: rgba(236, 72, 153, 0.15); color: var(--badge-math); border: 1px solid var(--badge-math); }
    .badge-Русский { background: rgba(245, 158, 11, 0.15); color: var(--badge-rus); border: 1px solid var(--badge-rus); }

    .topic-tag { font-size: 0.9rem; color: var(--text-muted); font-weight: 500; }
    
    .question-box {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    
    .answer-box {
      margin-top: 16px;
      padding: 16px;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      border-left: 4px solid var(--accent);
      display: none;
      font-size: 1.15rem;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
      max-width: 100%;
    }
    
    .katex-display {
      margin: 0.5em 0 !important;
      text-align: left !important;
      white-space: normal !important;
      word-break: break-word !important;
      overflow-wrap: break-word !important;
    }
    .katex {
      white-space: normal !important;
      word-break: break-word !important;
      overflow-wrap: break-word !important;
    }

    .flashcard-actions { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }

    /* Форма ввода */
    .form-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.875rem; color: var(--text-muted); margin-bottom: 6px; font-weight: 500; }
    input, textarea, select {
      width: 100%;
      background: var(--card-bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 1rem;
      line-height: 1.5;
    }
    input:focus, textarea:focus, select:focus { outline: none; border-color: var(--accent); }

    /* Переключатель режима ввода ответа */
    .input-mode-switcher {
      display: flex;
      gap: 6px;
      margin-bottom: 8px;
    }
    .mode-btn {
      padding: 5px 12px;
      font-size: 0.85rem;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Панель формул Word-стиля */
    .math-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 8px;
      background: rgba(0,0,0,0.25);
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .math-btn {
      padding: 5px 10px;
      font-size: 0.88rem;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
    }
    .math-btn:hover { background: var(--accent); color: white; border-color: var(--accent); }

    math-field {
      width: 100%;
      font-size: 1.25rem;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      min-height: 52px;
      display: block;
    }
    math-field:focus-within { border-color: var(--accent); outline: none; }

    /* Список карточек */
    .card-list { display: flex; flex-direction: column; gap: 14px; margin-top: 24px; }
    .list-item {
      background: var(--card-bg);
      border: 1px solid var(--border);
      padding: 18px 20px;
      border-radius: 10px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 16px;
      transition: background 0.2s;
      overflow: hidden;
    }
    .list-item:hover { background: var(--card-hover); }
    .item-content { flex: 1; min-width: 0; }
    .item-question {
      font-size: 1.05rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }
    .item-answer {
      font-size: 1rem;
      color: #cbd5e1;
      line-height: 1.5;
      background: rgba(0,0,0,0.2);
      padding: 10px 12px;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
      overflow-wrap: break-word;
    }

    .item-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .edit-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    .edit-btn:hover { border-color: var(--accent); color: var(--text); background: rgba(99, 102, 241, 0.1); }
    .delete-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--danger);
      font-size: 1.1rem;
      cursor: pointer;
      padding: 5px 9px;
      border-radius: 6px;
    }
    .delete-btn:hover { background: var(--danger-bg); border-color: var(--danger); }
    
    .form-buttons { display: flex; gap: 10px; margin-top: 8px; }
    .empty-state { text-align: center; color: var(--text-muted); padding: 40px 0; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand-title">
      <h1>🧠 ЕГЭ Тренажёр</h1>
      <span class="status-dot" title="Синхронизировано с облаком Supabase"></span>
    </div>
    <div class="tabs">
      <button class="active" onclick="switchTab('practice')">Практика</button>
      <button onclick="switchTab('editor')">База вопросов (<span id="count">...</span>)</button>
    </div>
  </header>

  <!-- ВКЛАДКА ТРЕНИРОВКИ -->
  <section id="view-practice" class="view active">
    <div class="filter-panel">
      <div class="filter-title">Предмет:</div>
      <div class="subject-pills">
        <div class="pill active" onclick="setSubjectFilter('all', this)">Все предметы</div>
        <div class="pill" onclick="setSubjectFilter('Физика', this)">Физика</div>
        <div class="pill" onclick="setSubjectFilter('Математика', this)">Математика</div>
        <div class="pill" onclick="setSubjectFilter('Русский язык', this)">Русский язык</div>
      </div>

      <div class="filter-title" style="display:flex; justify-content:space-between; align-items:center;">
        <span>Разделы:</span>
        <span style="font-size:0.75rem; cursor:pointer; color:var(--accent);" onclick="toggleAllTopics()">Выбрать все / Снять</span>
      </div>
      <div class="topics-container" id="topics-filter-list"></div>
    </div>

    <div id="practice-card-container"></div>
  </section>

  <!-- ВКЛАДКА РЕДАКТОРА -->
  <section id="view-editor" class="view">
    <form id="add-form" onsubmit="saveCardForm(event)">
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
        <div class="form-group">
          <label>Предмет</label>
          <select id="input-subject" onchange="autoSelectMode(this.value)" required>
            <option value="Физика">Физика</option>
            <option value="Математика">Математика</option>
            <option value="Русский язык">Русский язык</option>
          </select>
        </div>
        <div class="form-group">
          <label>Раздел / Тема</label>
          <input type="text" id="input-topic" placeholder="например: Тригонометрия, Кинематика" required>
        </div>
      </div>

      <div class="form-group">
        <label>Вопрос / Понятие</label>
        <textarea id="input-question" rows="2" placeholder="Основное тригонометрическое тождество" required></textarea>
      </div>

      <div class="form-group">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
          <label style="margin-bottom:0;">Правильный ответ:</label>
          
          <!-- Переключатель режима ответа -->
          <div class="input-mode-switcher">
            <button type="button" class="mode-btn active" id="btn-mode-math" onclick="setAnswerMode('math')">📐 Формула (Word-стиль)</button>
            <button type="button" class="mode-btn" id="btn-mode-text" onclick="setAnswerMode('text')">📝 Текст / Определение</button>
          </div>
        </div>

        <!-- 1. ВИЗУАЛЬНЫЙ РЕДАКТОР ФОРМУЛ (WORD-СТИЛЬ) -->
        <div id="math-input-wrapper">
          <div class="math-toolbar">
            <button type="button" class="math-btn" onclick="insertMathTemplate('#?^{#?}')">xⁿ Степень</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('#?_{#?}')">xₙ Индекс</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\frac{#?}{#?}')">½ Дробь</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\sqrt{#?}')">√ Корень</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\cdot')">· Умножить</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\sin(#?)')">sin</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\cos(#?)')">cos</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\pi')">π</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\alpha')">α</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\Delta')">Δ</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\varepsilon')">ε</button>
            <button type="button" class="math-btn" onclick="insertMathTemplate('\\lambda')">λ</button>
          </div>
          <math-field id="math-editor" math-mode-space="\;"></math-field>
          <small style="color:var(--text-muted); display:block; margin-top:4px;">Нажимайте кнопки степеней/дробей и вводите формулу визуально.</small>
        </div>

        <!-- 2. ТЕКСТОВОЕ ПОЛЕ -->
        <div id="text-input-wrapper" style="display:none;">
          <textarea id="text-editor" rows="3" placeholder="Введите определение своими словами..."></textarea>
        </div>
      </div>

      <div class="form-buttons">
        <button type="submit" id="save-btn" class="btn-primary">+ Сохранить в облако Supabase</button>
        <button type="button" id="cancel-edit-btn" class="btn-secondary" style="display:none" onclick="cancelEditing()">Отмена</button>
      </div>
    </form>

    <div class="card-list" id="card-list"></div>
  </section>
</div>

<script>
  const SUPABASE_URL = 'https://lhymatecnqucjdijmgww.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxoeW1hdGVjbnF1Y2pkaWptZ3d3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5NzcyNTgsImV4cCI6MjEwMjU1MzI1OH0.IqlSb0aitLZ5mQUXlVaAfrDp0lwuaJlf2bIbVEb7Ffw';

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let deck = [];
  let currentSubject = 'all';
  let selectedTopics = new Set();
  let filteredDeck = [];
  let currentIndex = 0;
  let editingCardId = null;
  let currentAnswerMode = 'math'; // 'math' или 'text'

  function setAnswerMode(mode) {
    currentAnswerMode = mode;
    const mathWrapper = document.getElementById('math-input-wrapper');
    const textWrapper = document.getElementById('text-input-wrapper');
    const btnMath = document.getElementById('btn-mode-math');
    const btnText = document.getElementById('btn-mode-text');

    if (mode === 'math') {
      mathWrapper.style.display = 'block';
      textWrapper.style.display = 'none';
      btnMath.classList.add('active');
      btnText.classList.remove('active');
    } else {
      mathWrapper.style.display = 'none';
      textWrapper.style.display = 'block';
      btnMath.classList.remove('active');
      btnText.classList.add('active');
    }
  }

  function autoSelectMode(subj) {
    if (subj === 'Русский язык') {
      setAnswerMode('text');
    } else {
      setAnswerMode('math');
    }
  }

  function insertMathTemplate(template) {
    const mf = document.getElementById('math-editor');
    mf.executeCommand(['insert', template]);
    mf.focus();
  }

  async function fetchDeck() {
    try {
      const { data, error } = await supabaseClient
        .from('cards')
        .select('*')
        .order('id', { ascending: false });

      if (error) throw error;
      deck = data || [];
      updateDeckCount();
      updateTopicsFilterUI(true);
      filterDeck();
      renderEditorList();
    } catch (err) {
      console.error('Ошибка загрузки данных:', err);
    }
  }

  function renderMath() {
    if (window.renderMathInElement) {
      renderMathInElement(document.body, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '$', right: '$', display: false }
        ],
        throwOnError: false
      });
    }
  }

  function updateDeckCount() {
    document.getElementById('count').textContent = deck.length;
  }

  function setSubjectFilter(subject, el) {
    currentSubject = subject;
    document.querySelectorAll('.subject-pills .pill').forEach(p => p.classList.remove('active'));
    el.classList.add('active');
    updateTopicsFilterUI(true);
    filterDeck();
  }

  function updateTopicsFilterUI(resetSelection = false) {
    const container = document.getElementById('topics-filter-list');
    const availableCards = currentSubject === 'all' 
      ? deck 
      : deck.filter(c => c.subject === currentSubject);

    const uniqueTopics = [...new Set(availableCards.map(c => c.topic))].filter(Boolean);

    if (resetSelection || selectedTopics.size === 0) {
      selectedTopics = new Set(uniqueTopics);
    } else {
      selectedTopics = new Set(uniqueTopics.filter(t => selectedTopics.has(t)));
      if (selectedTopics.size === 0) selectedTopics = new Set(uniqueTopics);
    }

    container.innerHTML = '';
    if (uniqueTopics.length === 0) {
      container.innerHTML = '<span style="color:var(--text-muted); font-size:0.85rem">Нет разделов</span>';
      return;
    }

    uniqueTopics.forEach(topic => {
      const label = document.createElement('label');
      label.className = 'topic-chip';
      const isChecked = selectedTopics.has(topic);
      label.innerHTML = `
        <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleTopic('${topic.replace(/'/g, "\\'")}', this.checked)">
        <span>${topic}</span>
      `;
      container.appendChild(label);
    });
  }

  function toggleTopic(topic, isChecked) {
    if (isChecked) selectedTopics.add(topic);
    else selectedTopics.delete(topic);
    filterDeck();
  }

  function toggleAllTopics() {
    const availableCards = currentSubject === 'all' 
      ? deck 
      : deck.filter(c => c.subject === currentSubject);
    const uniqueTopics = [...new Set(availableCards.map(c => c.topic))];

    if (selectedTopics.size === uniqueTopics.length) selectedTopics.clear();
    else selectedTopics = new Set(uniqueTopics);

    updateTopicsFilterUI();
    filterDeck();
  }

  function filterDeck() {
    filteredDeck = deck.filter(card => {
      const matchSubject = currentSubject === 'all' || card.subject === currentSubject;
      const matchTopic = selectedTopics.has(card.topic);
      return matchSubject && matchTopic;
    });

    currentIndex = 0;
    renderPracticeCard();
  }

  function switchTab(tab) {
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));

    if (tab === 'practice') {
      document.querySelector('.tabs button:first-child').classList.add('active');
      document.getElementById('view-practice').classList.add('active');
      filterDeck();
    } else {
      document.querySelector('.tabs button:last-child').classList.add('active');
      document.getElementById('view-editor').classList.add('active');
      renderEditorList();
    }
  }

  function getBadgeClass(subj) {
    if (subj === 'Физика') return 'badge-Физика';
    if (subj === 'Математика') return 'badge-Математика';
    return 'badge-Русский';
  }

  function formatMathContent(text) {
    if (!text) return '';
    if (text.startsWith('\\text{') && text.endsWith('}')) {
      text = text.slice(6, -1);
    }
    const hasCyrillic = /[а-яА-ЯёЁ]/.test(text);
    if (!hasCyrillic && !text.includes('$') && (/^[a-zA-Z0-9\\_^{\}\(\)\+\-\*\/\=\s\.\,\<\>\:\;\^\%]+$/.test(text) || text.includes('\\'))) {
      return `$$ ${text} $$`;
    }
    return text;
  }

  function renderPracticeCard() {
    const container = document.getElementById('practice-card-container');
    if (filteredDeck.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <h3>Нет карточек по выбранным фильтрам</h3>
          <p style="margin-top:8px">Добавьте карточки во вкладке «База вопросов».</p>
        </div>`;
      return;
    }

    if (currentIndex >= filteredDeck.length) currentIndex = 0;
    const card = filteredDeck[currentIndex];

    container.innerHTML = `
      <div class="flashcard">
        <div>
          <div class="meta-tags">
            <span class="badge ${getBadgeClass(card.subject)}">${card.subject}</span>
            <span class="topic-tag">${card.topic}</span>
          </div>
          <div class="question-box">${card.question}</div>
          <div class="answer-box" id="answer-content">${formatMathContent(card.answer)}</div>
        </div>
        <div class="flashcard-actions">
          <button id="show-btn" style="flex:1" onclick="toggleAnswer()">Показать ответ</button>
          <button id="skip-btn" class="btn-secondary" style="flex:1" onclick="skipOrOralAnswer()">Ответить устно / Пропустить</button>
          <button style="flex:1; display:none" id="next-btn" class="btn-primary" onclick="nextCard()">Следующий вопрос →</button>
        </div>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <span style="color:var(--text-muted); font-size:0.875rem">Вопрос ${currentIndex + 1} из ${filteredDeck.length}</span>
        <button style="font-size:0.875rem" onclick="shuffleDeck()">🔀 Перемешать</button>
      </div>
    `;
    renderMath();
  }

  function toggleAnswer() {
    document.getElementById('answer-content').style.display = 'block';
    document.getElementById('show-btn').style.display = 'none';
    document.getElementById('skip-btn').style.display = 'none';
    document.getElementById('next-btn').style.display = 'block';
    renderMath();
  }

  function skipOrOralAnswer() {
    toggleAnswer();
  }

  function nextCard() {
    currentIndex = (currentIndex + 1) % filteredDeck.length;
    renderPracticeCard();
  }

  function shuffleDeck() {
    for (let i = filteredDeck.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [filteredDeck[i], filteredDeck[j]] = [filteredDeck[j], filteredDeck[i]];
    }
    currentIndex = 0;
    renderPracticeCard();
  }

  function startEditing(id) {
    const card = deck.find(c => c.id === id);
    if (!card) return;

    editingCardId = id;
    document.getElementById('input-subject').value = card.subject;
    document.getElementById('input-topic').value = card.topic;
    document.getElementById('input-question').value = card.question;
    
    let ans = card.answer;
    const isPureFormula = !/[а-яА-ЯёЁ]/.test(ans) || ans.includes('\\frac') || ans.includes('\\sqrt') || ans.includes('^');
    
    if (isPureFormula) {
      setAnswerMode('math');
      document.getElementById('math-editor').setValue(ans);
    } else {
      setAnswerMode('text');
      if (ans.startsWith('\\text{') && ans.endsWith('}')) {
        ans = ans.slice(6, -1);
      }
      document.getElementById('text-editor').value = ans;
    }

    const saveBtn = document.getElementById('save-btn');
    saveBtn.textContent = '💾 Обновить карточку';
    document.getElementById('cancel-edit-btn').style.display = 'inline-block';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function cancelEditing() {
    editingCardId = null;
    document.getElementById('add-form').reset();
    document.getElementById('math-editor').setValue('');
    document.getElementById('text-editor').value = '';
    const saveBtn = document.getElementById('save-btn');
    saveBtn.textContent = '+ Сохранить в облако Supabase';
    document.getElementById('cancel-edit-btn').style.display = 'none';
  }

  async function saveCardForm(e) {
    e.preventDefault();
    const btn = document.getElementById('save-btn');
    const subject = document.getElementById('input-subject').value;
    const topic = document.getElementById('input-topic').value.trim();
    const question = document.getElementById('input-question').value.trim();
    
    let answer = '';
    if (currentAnswerMode === 'math') {
      answer = document.getElementById('math-editor').getValue().trim();
    } else {
      answer = document.getElementById('text-editor').value.trim();
    }

    if (!subject || !topic || !question || !answer) {
      alert('Пожалуйста, заполните все поля!');
      return;
    }

    btn.disabled = true;

    try {
      if (editingCardId) {
        btn.textContent = 'Обновление в облаке...';
        const { data, error } = await supabaseClient
          .from('cards')
          .update({ subject, topic, question, answer })
          .eq('id', editingCardId)
          .select();

        if (error) throw error;

        const idx = deck.findIndex(c => c.id === editingCardId);
        if (idx !== -1 && data && data[0]) {
          deck[idx] = data[0];
        }
        cancelEditing();
      } else {
        btn.textContent = 'Сохранение в облако...';
        const { data, error } = await supabaseClient
          .from('cards')
          .insert([{ subject, topic, question, answer }])
          .select();

        if (error) throw error;

        if (data && data[0]) {
          deck.unshift(data[0]);
        }
        document.getElementById('input-question').value = '';
        document.getElementById('math-editor').setValue('');
        document.getElementById('text-editor').value = '';
        document.getElementById('input-topic').focus();
      }

      updateDeckCount();
      updateTopicsFilterUI();
      filterDeck();
      renderEditorList();
    } catch (err) {
      alert('Ошибка при сохранении: ' + err.message);
    } finally {
      btn.disabled = false;
      if (!editingCardId) {
        btn.textContent = '+ Сохранить в облако Supabase';
      }
    }
  }

  async function deleteCard(id) {
    if (!confirm('Удалить эту карточку?')) return;

    try {
      const { error } = await supabaseClient
        .from('cards')
        .delete()
        .eq('id', id);

      if (error) throw error;

      if (editingCardId === id) cancelEditing();

      deck = deck.filter(item => item.id !== id);
      updateDeckCount();
      updateTopicsFilterUI();
      filterDeck();
      renderEditorList();
    } catch (err) {
      alert('Ошибка при удалении: ' + err.message);
    }
  }

  function renderEditorList() {
    const list = document.getElementById('card-list');
    list.innerHTML = '';

    deck.forEach(item => {
      const el = document.createElement('div');
      el.className = 'list-item';
      el.innerHTML = `
        <div class="item-content">
          <div class="meta-tags">
            <span class="badge ${getBadgeClass(item.subject)}">${item.subject}</span>
            <span class="topic-tag">${item.topic}</span>
          </div>
          <div class="item-question">${item.question}</div>
          <div class="item-answer">${formatMathContent(item.answer)}</div>
        </div>
        <div class="item-actions">
          <button class="edit-btn" onclick="startEditing(${item.id})" title="Редактировать">✎ Редактировать</button>
          <button class="delete-btn" onclick="deleteCard(${item.id})" title="Удалить">✕</button>
        </div>
      `;
      list.appendChild(el);
    });
    renderMath();
  }

  window.addEventListener('DOMContentLoaded', () => {
    fetchDeck();
  });
</script>
</body>
</html>
