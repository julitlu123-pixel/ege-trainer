<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Личный Дашборд & ЕГЭ Тренажёр</title>

  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236366f1' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><ellipse cx='12' cy='12' rx='10' ry='4' transform='rotate(45 12 12)'/><ellipse cx='12' cy='12' rx='10' ry='4' transform='rotate(-45 12 12)'/><circle cx='12' cy='12' r='2' fill='%236366f1'/></svg>">

  <!-- KaTeX -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>

  <!-- MathLive -->
  <script defer src="https://cdn.jsdelivr.net/npm/mathlive"></script>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg: #0b1120;
      --card-bg: rgba(30, 41, 59, 0.85); 
      --card-hover: rgba(36, 50, 72, 0.95);
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --text: #f8fafc;
      --text-muted: #cbd5e1;
      --border: rgba(51, 65, 85, 0.6);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.15);
      --success: #10b981;
      --success-bg: rgba(16, 185, 129, 0.15);
      --btn-secondary: #334155;
      --trello-col: rgba(21, 30, 46, 0.75);
      --badge-physics: #38bdf8;
      --badge-math: #f59e0b;
      --badge-rus: #ec4899;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    
    body {
      background-color: var(--bg); background-size: cover; background-position: center;
      background-attachment: fixed; background-repeat: no-repeat;
      color: var(--text); line-height: 1.6; padding: 16px 12px;
      display: flex; justify-content: center; min-height: 100vh; overflow-x: hidden;
    }

    body::before {
      content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(11, 17, 32, 0.75); z-index: -1;
    }

    .container { width: 100%; max-width: 1100px; position: relative; z-index: 1; }
    
    header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
      background: var(--card-bg); padding: 14px 18px;
      border-radius: 16px; border: 1px solid var(--border); backdrop-filter: blur(10px);
    }

    .brand-title { display: flex; align-items: center; gap: 10px; }
    .brand-logo {
      width: 38px; height: 38px; background: linear-gradient(135deg, #6366f1 0%, #a855f7 100%);
      border-radius: 10px; display: flex; align-items: center; justify-content: center;
      color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.35); flex-shrink: 0;
    }
    .brand-logo svg { width: 22px; height: 22px; }
    h1 { font-size: 1.35rem; font-weight: 700; margin: 0; }
    
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; width: 100%; }
    @media(min-width: 768px) { .tabs { width: auto; } }
    .tabs button {
      background: rgba(0,0,0,0.3); color: var(--text); border: 1px solid var(--border);
      padding: 7px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; font-size: 0.88rem; transition: all 0.2s; flex: 1 1 auto; text-align: center;
    }
    .tabs button:hover { border-color: var(--accent); background: rgba(99,102,241,0.1); }
    .tabs button.active { background: var(--accent); border-color: var(--accent); color: #fff; }

    .view { display: none; }
    .view.active { display: block; }
    button.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; padding: 10px 16px; font-weight: 600; font-size: 0.95rem; cursor: pointer; border-radius: 8px; border: none; transition: 0.2s; }
    button.btn-primary:hover { background: var(--accent-hover); }
    button.btn-secondary { background: var(--btn-secondary); color: #fff; padding: 10px 16px; font-weight: 600; font-size: 0.95rem; cursor: pointer; border-radius: 8px; border: none; transition: 0.2s; }
    button.btn-secondary:hover { background: #475569; }

    /* НАСТРОЙКИ */
    .settings-panel {
      background: var(--card-bg); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px; margin-bottom: 20px; backdrop-filter: blur(10px);
    }
    .settings-panel h2 { margin-bottom: 14px; font-size: 1.2rem; border-bottom: 1px solid var(--border); padding-bottom: 6px; }

    /* ТРЕКЕР ЗАДАЧ */
    .task-form { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 20px; backdrop-filter: blur(10px); }
    .task-inputs-row { display: grid; gap: 10px; grid-template-columns: 1fr; align-items: center; }
    @media(min-width: 768px) {
      .task-inputs-row { grid-template-columns: 1fr auto auto auto auto; }
    }
    
    .task-form input[type="text"], .task-form input[type="date"], .task-form input[type="time"], .task-form select { background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; font-size: 0.9rem; outline: none; width: 100%; }
    .task-form select { cursor: pointer; }

    .kanban-board { display: flex; gap: 16px; align-items: flex-start; flex-direction: column; }
    @media(min-width: 768px) {
      .kanban-board { flex-direction: row; }
    }
    .kanban-col { flex: 1; width: 100%; background: var(--trello-col); border: 1px solid var(--border); border-radius: 12px; padding: 14px; backdrop-filter: blur(5px); }
    .kanban-col h3 { font-size: 1rem; margin-bottom: 14px; display: flex; justify-content: space-between; align-items: center; }
    .task-count { background: rgba(0,0,0,0.4); padding: 2px 7px; border-radius: 12px; font-size: 0.75rem; }

    .task-list-container { 
      max-height: 480px; 
      overflow-y: auto; 
      display: flex; 
      flex-direction: column; 
      gap: 10px; 
    }

    .task-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; display: flex; justify-content: space-between; align-items: center; }

    /* КАЛЕНДАРЬ */
    .calendar-header-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card-bg); border: 1px solid var(--border); padding: 12px 18px; border-radius: 12px; margin-bottom: 12px; }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .day-name { text-align: center; font-weight: 600; color: var(--text-muted); padding: 6px 0; font-size: 0.78rem; background: var(--card-bg); border-radius: 6px; }
    .cal-cell { background: var(--card-bg); border: 1px solid var(--border); border-radius: 6px; min-height: 80px; padding: 6px; }

    /* ТРЕНАЖЁР И БАЗА */
    .filter-panel { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 16px; backdrop-filter: blur(10px); }
    .subject-pills { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 14px; }
    .pill { padding: 5px 12px; border-radius: 20px; font-size: 0.82rem; cursor: pointer; border: 1px solid var(--border); background: rgba(0,0,0,0.3); }
    .pill.active { background: var(--accent); border-color: var(--accent); color: #fff; }
    
    .topics-controls { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
    .topic-action-btn { font-size: 0.78rem; padding: 3px 8px; background: rgba(0,0,0,0.3); color: var(--text); border: 1px solid var(--border); border-radius: 4px; cursor: pointer; }
    .topic-action-btn:hover { background: var(--accent); border-color: var(--accent); }

    .topics-list-wrapper { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; max-height: 160px; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 5px; }
    .topic-list-item { display: flex; align-items: center; padding: 6px 10px; background: rgba(255,255,255,0.03); border-radius: 6px; }
    .topic-list-item label { display: flex; align-items: center; gap: 8px; width: 100%; font-size: 0.85rem; cursor: pointer; }
    
    .flashcard { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 20px 18px; margin-bottom: 16px; }
    .badge { font-size: 0.72rem; padding: 2px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; background: rgba(0,0,0,0.4); }
    .badge-Физика { color: var(--badge-physics); border: 1px solid var(--badge-physics); }
    .badge-Математика { color: var(--badge-math); border: 1px solid var(--badge-math); }
    .badge-Русский { color: var(--badge-rus); border: 1px solid var(--badge-rus); }

    .question-box { font-size: 1.08rem; font-weight: 600; margin: 14px 0; }
    .answer-box { margin-top: 16px; padding: 16px 18px; background: rgba(0,0,0,0.45); border-radius: 8px; border-left: 4px solid var(--accent); display: none; }
    
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--text-muted); margin-bottom: 5px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; background: rgba(0,0,0,0.3); border: 1px solid var(--border); color: var(--text); padding: 9px 12px; border-radius: 8px; outline: none; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <div class="brand-title">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <div>
        <h1>Личный Дашборд</h1>
      </div>
    </div>
    
    <div class="tabs">
      <button class="active" onclick="switchTab('tracker')">✅ Задачи</button>
      <button onclick="switchTab('calendar')">📅 Календарь</button>
      <button onclick="switchTab('practice')">🧠 Тренажёр</button>
      <button onclick="switchTab('editor')">⚙️ База</button>
      <button onclick="switchTab('settings')">🎨 Опции</button>
    </div>
  </header>

  <!-- ВКЛАДКА 0: НАСТРОЙКИ -->
  <section id="view-settings" class="view">
    <div class="settings-panel">
      <h2>🖼️ Оформление сайта</h2>
      <div class="form-group">
        <label>Фоновое изображение:</label>
        <input type="file" accept="image/*" onchange="changeBackground(event)">
      </div>
    </div>
  </section>

  <!-- ВКЛАДКА 1: ТРЕКЕР ЗАДАЧ -->
  <section id="view-tracker" class="view active">
    <div class="task-form">
      <div class="task-inputs-row">
        <input type="text" id="task-title" placeholder="Напиши задачу...">
        <button class="btn-primary" onclick="addTask()">Добавить</button>
      </div>
    </div>

    <div class="kanban-board">
      <div class="kanban-col">
        <h3>В планах <span class="task-count" id="count-todo">0</span></h3>
        <div class="task-list-container" id="todo-list"></div>
      </div>
      <div class="kanban-col">
        <h3>Выполнено <span class="task-count" id="count-done">0</span></h3>
        <div class="task-list-container" id="done-list"></div>
      </div>
    </div>
  </section>

  <!-- ВКЛАДКА 2: КАЛЕНДАРЬ -->
  <section id="view-calendar" class="view">
    <div class="calendar-header-bar">
      <h2>Календарь событий</h2>
    </div>
    <div class="calendar-grid">
      <div class="day-name">Пн</div><div class="day-name">Вт</div><div class="day-name">Ср</div>
      <div class="day-name">Чт</div><div class="day-name">Пт</div><div class="day-name">Сб</div><div class="day-name">Вс</div>
    </div>
    <div class="calendar-grid" id="calendar-grid-cells"></div>
  </section>

  <!-- ВКЛАДКА 3: ТРЕНАЖЁР -->
  <section id="view-practice" class="view">
    <div class="filter-panel">
      <div class="subject-pills">
        <div class="pill active" onclick="setPracticeSubject('all', this)">Все предметы</div>
        <div class="pill" onclick="setPracticeSubject('Физика', this)">Физика</div>
        <div class="pill" onclick="setPracticeSubject('Математика', this)">Математика</div>
        <div class="pill" onclick="setPracticeSubject('Русский язык', this)">Русский язык</div>
      </div>
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">РАЗДЕЛЫ ДЛЯ ТРЕНИРОВКИ:</span>
        <div class="topics-controls">
          <button type="button" class="topic-action-btn" onclick="toggleAllPracticeTopics(true)">Выбрать всё</button>
          <button type="button" class="topic-action-btn" onclick="toggleAllPracticeTopics(false)">Снять всё</button>
        </div>
      </div>
      <div class="topics-list-wrapper" id="practice-topics-list"></div>
    </div>
    <div id="practice-card-container"></div>
  </section>

  <!-- ВКЛАДКА 4: БАЗА ВОПРОСОВ -->
  <section id="view-editor" class="view">
    <div class="filter-panel">
      <h2>Добавить новую карточку</h2>
      <div class="form-group">
        <label>Предмет:</label>
        <select id="editor-subject">
          <option value="Физика">Физика</option>
          <option value="Математика">Математика</option>
          <option value="Русский язык">Русский язык</option>
        </select>
      </div>
      <div class="form-group">
        <label>Тема:</label>
        <input type="text" id="editor-topic" placeholder="Например: Механика, Производные...">
      </div>
      <div class="form-group">
        <label>Вопрос:</label>
        <textarea id="editor-question" rows="3"></textarea>
      </div>
      <div class="form-group">
        <label>Ответ:</label>
        <textarea id="editor-answer" rows="3"></textarea>
      </div>
      <button class="btn-primary" onclick="saveCardToSupabase()">Сохранить карточку</button>
    </div>

    <div class="filter-panel">
      <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
        <span style="font-size:0.85rem; font-weight:600; color:var(--text-muted);">ФИЛЬТР БАЗЫ:</span>
        <div class="topics-controls">
          <button type="button" class="topic-action-btn" onclick="toggleAllEditorTopics(true)">Выбрать всё</button>
          <button type="button" class="topic-action-btn" onclick="toggleAllEditorTopics(false)">Снять всё</button>
        </div>
      </div>
      <div class="topics-list-wrapper" id="editor-topics-list"></div>
    </div>
    <div id="editor-card-container"></div>
  </section>

</div>

<script>
  // ==========================================
  // 1. ИНИЦИАЛИЗАЦИЯ SUPABASE
  // ==========================================
  // Вставьте сюда ваши данные из настроек Supabase (Project Settings -> API)
  const SUPABASE_URL = 'https://YOUR_SUPABASE_PROJECT.supabase.co';
  const SUPABASE_KEY = 'YOUR_SUPABASE_ANON_KEY';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  let cardsData = [];
  let currentPracticeSubject = 'all';
  let selectedPracticeTopics = new Set();
  let selectedEditorTopics = new Set();

  // Инициализация загрузки при старте
  document.addEventListener('DOMContentLoaded', () => {
    loadCards();
    renderCalendar();
  });

  // Навигация по вкладкам
  function switchTab(tabId) {
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.querySelectorAll('.tabs button').forEach(b => b.classList.remove('active'));
    
    document.getElementById(`view-${tabId}`).classList.add('active');
    event.target.classList.add('active');
  }

  // Смена фона
  function changeBackground(e) {
    const file = e.target.files[0];
    if (file) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        document.body.style.backgroundImage = `url('${evt.target.result}')`;
      };
      reader.readAsDataURL(file);
    }
  }

  // ==========================================
  // 2. ЗАГРУЗКА И ОТОБРАЖЕНИЕ КАРТОЧЕК ИЗ SUPABASE
  // ==========================================
  async function loadCards() {
    try {
      const { data, error } = await supabase.from('cards').select('*');
      if (error) {
        console.error('Ошибка Supabase:', error.message);
        return;
      }
      cardsData = data || [];
      populateTopicFilters();
      renderPracticeCards();
      renderEditorCards();
    } catch (err) {
      console.error('Ошибка сети:', err);
    }
  }

  // Заполнение списков тем для фильтров
  function populateTopicFilters() {
    const topics = [...new Set(cardsData.map(c => c.topic).filter(Boolean))];
    
    // Заполнение тренажёра
    const practiceContainer = document.getElementById('practice-topics-list');
    practiceContainer.innerHTML = '';
    selectedPracticeTopics = new Set(topics);

    // Заполнение редактора
    const editorContainer = document.getElementById('editor-topics-list');
    editorContainer.innerHTML = '';
    selectedEditorTopics = new Set(topics);

    topics.forEach(topic => {
      // Для Тренажёра
      const pItem = document.createElement('div');
      pItem.className = 'topic-list-item';
      pItem.innerHTML = `<label><input type="checkbox" value="${topic}" checked onchange="onPracticeTopicToggle(this)"> ${topic}</label>`;
      practiceContainer.appendChild(pItem);

      // Для Редактора
      const eItem = document.createElement('div');
      eItem.className = 'topic-list-item';
      eItem.innerHTML = `<label><input type="checkbox" value="${topic}" checked onchange="onEditorTopicToggle(this)"> ${topic}</label>`;
      editorContainer.appendChild(eItem);
    });
  }

  // ==========================================
  // 3. ЛОГИКА ВЫДЕЛЕНИЯ / СНЯТИЯ ВСЕХ ГАЛОЧЕК (ИСПРАВЛЕНО)
  // ==========================================
  function toggleAllPracticeTopics(selectAll) {
    const checkboxes = document.querySelectorAll('#practice-topics-list input[type="checkbox"]');
    checkboxes.forEach(chk => {
      chk.checked = selectAll;
      if (selectAll) {
        selectedPracticeTopics.add(chk.value);
      } else {
        selectedPracticeTopics.delete(chk.value);
      }
    });
    renderPracticeCards();
  }

  function toggleAllEditorTopics(selectAll) {
    const checkboxes = document.querySelectorAll('#editor-topics-list input[type="checkbox"]');
    checkboxes.forEach(chk => {
      chk.checked = selectAll;
      if (selectAll) {
        selectedEditorTopics.add(chk.value);
      } else {
        selectedEditorTopics.delete(chk.value);
      }
    });
    renderEditorCards();
  }

  function onPracticeTopicToggle(chk) {
    if (chk.checked) selectedPracticeTopics.add(chk.value);
    else selectedPracticeTopics.delete(chk.value);
    renderPracticeCards();
  }

  function onEditorTopicToggle(chk) {
    if (chk.checked) selectedEditorTopics.add(chk.value);
    else selectedEditorTopics.delete(chk.value);
    renderEditorCards();
  }

  function setPracticeSubject(subject, btn) {
    currentPracticeSubject = subject;
    document.querySelectorAll('.subject-pills .pill').forEach(p => p.classList.remove('active'));
    btn.classList.add('active');
    renderPracticeCards();
  }

  // ==========================================
  // 4. ОТРЕСОВКА КАРТОЧЕК В ТРЕНАЖЁРЕ И РЕДАКТОРЕ
  // ==========================================
  function renderPracticeCards() {
    const container = document.getElementById('practice-card-container');
    container.innerHTML = '';

    const filtered = cardsData.filter(card => {
      const matchSubject = (currentPracticeSubject === 'all' || card.subject === currentPracticeSubject);
      const matchTopic = selectedPracticeTopics.has(card.topic);
      return matchSubject && matchTopic;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="flashcard">Карточки не найдены.</div>';
      return;
    }

    filtered.forEach(card => {
      const cardEl = document.createElement('div');
      cardEl.className = 'flashcard';
      cardEl.innerHTML = `
        <span class="badge badge-${card.subject}">${card.subject}</span>
        <div class="question-box">${card.question}</div>
        <button class="btn-primary" onclick="this.nextElementSibling.style.display='block'">Показать ответ</button>
        <div class="answer-box">${card.answer}</div>
      `;
      container.appendChild(cardEl);
    });

    if (window.renderMathInElement) renderMathInElement(container);
  }

  function renderEditorCards() {
    const container = document.getElementById('editor-card-container');
    container.innerHTML = '';

    const filtered = cardsData.filter(card => selectedEditorTopics.has(card.topic));

    filtered.forEach(card => {
      const cardEl = document.createElement('div');
      cardEl.className = 'flashcard';
      cardEl.innerHTML = `
        <span class="badge badge-${card.subject}">${card.subject} | ${card.topic}</span>
        <div class="question-box">${card.question}</div>
        <div class="answer-box" style="display:block;">${card.answer}</div>
        <button class="btn-secondary" style="margin-top:10px; background:var(--danger);" onclick="deleteCard('${card.id}')">Удалить</button>
      `;
      container.appendChild(cardEl);
    });
  }

  // Сохранение новой карточки в Supabase
  async function saveCardToSupabase() {
    const subject = document.getElementById('editor-subject').value;
    const topic = document.getElementById('editor-topic').value;
    const question = document.getElementById('editor-question').value;
    const answer = document.getElementById('editor-answer').value;

    if (!topic || !question || !answer) {
      alert('Пожалуйста, заполните все поля!');
      return;
    }

    const { data, error } = await supabase.from('cards').insert([{ subject, topic, question, answer }]);

    if (error) {
      alert('Ошибка добавления карточки: ' + error.message);
    } else {
      document.getElementById('editor-topic').value = '';
      document.getElementById('editor-question').value = '';
      document.getElementById('editor-answer').value = '';
      loadCards();
    }
  }

  async function deleteCard(id) {
    if (!confirm('Удалить карточку?')) return;
    const { error } = await supabase.from('cards').delete().eq('id', id);
    if (error) alert('Ошибка удаления: ' + error.message);
    else loadCards();
  }

  // ==========================================
  // 5. ТРЕКЕР ЗАДАЧ И КАЛЕНДАРЬ
  // ==========================================
  function addTask() {
    const title = document.getElementById('task-title').value;
    if (!title) return;

    const list = document.getElementById('todo-list');
    const item = document.createElement('div');
    item.className = 'task-card';
    item.innerHTML = `<span>${title}</span> <button class="btn-secondary" onclick="this.parentElement.remove(); updateTaskCounts();">✓</button>`;
    list.appendChild(item);

    document.getElementById('task-title').value = '';
    updateTaskCounts();
  }

  function updateTaskCounts() {
    document.getElementById('count-todo').innerText = document.getElementById('todo-list').children.length;
    document.getElementById('count-done').innerText = document.getElementById('done-list').children.length;
  }

  function renderCalendar() {
    const grid = document.getElementById('calendar-grid-cells');
    grid.innerHTML = '';
    for (let i = 1; i <= 31; i++) {
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      cell.innerText = i;
      grid.appendChild(cell);
    }
  }
</script>
</body>
</html>
